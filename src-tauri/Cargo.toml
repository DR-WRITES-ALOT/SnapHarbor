[package]
name = "snapharbor"
version = "1.0.0"
description = "SnapHarbor - Fast USB & SD Media Vault for Windows"
authors = ["DR-WRITES-ALOT"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
sha2 = "0.10"
walkdir = "2"

# NOTE: the `windows` crate used to be listed here for the MTP/Portable Devices
# APIs, but nothing in this codebase ever called them — device discovery only
# walks drive letters. It will come back together with a real MTP backend
# (see the notes at the top of src/wpd.rs).


